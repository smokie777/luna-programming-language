[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-programming-language"
version = "0.1.0"
description = "The Luna programming language"
requires-python = ">=3.10"

[project.scripts]
luna = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["tokenizer*", "parser*", "interpreter*", "common*"]